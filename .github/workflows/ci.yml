name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        php: ['8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sodium, pdo_sqlite, gmp, curl, fileinfo, iconv, dom, mbstring, xml, xmlwriter, zip
          coverage: none
          ini-values: memory_limit=768M, zend.assertions=1
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer doctor
      - run: composer test
      - run: composer analyse
      - name: Test optional SDK packages
        run: php vendor/bin/phpunit --bootstrap tools/bootstrap-packages.php packages --no-progress
      - name: Analyse optional SDK packages
        run: >-
          php vendor/bin/phpstan analyse --configuration=phpstan.neon.dist
          --autoload-file=tools/bootstrap-packages.php --level=6 --no-progress
          packages/channels-core/src packages/whatsapp-adapter/src
          packages/messenger/src packages/messenger-adapter/src packages/facebook/src
      - name: Verify the distributable
        if: matrix.php == '8.4'
        run: composer package

  docs:
    name: Documentation and examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python -m pip install -r tools/requirements-docs.txt
      - run: python tools/build_docs.py
      - run: python -m unittest discover -s tools/tests
      - run: >-
          git diff --exit-code -- docs/index.html docs/llms.txt docs/llms-full.txt
          docs/facebook/index.html docs/facebook/llms.txt docs/facebook/llms-full.txt
